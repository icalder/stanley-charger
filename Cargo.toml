[package]
name = "stanley-charger"
version = "0.1.0"
edition = "2024"

[dependencies]
binary-layout = "4.0.2"
btleplug = "0.11.8"
clap = { version = "4.5", features = ["derive"] }
futures = "0.3.31"
# The Cerbo's Venus OS reconfigures the serial port behind our back; termio is how
# the driver notices and puts it right.
nix = { version = "0.29", features = ["term"] }
serde = "1.0.228"
thiserror = "2.0.17"
tokio = { version = "1.49.0", features = ["full"] }
tokio-serial = "5.4.5"
uuid = "1.19.0"
